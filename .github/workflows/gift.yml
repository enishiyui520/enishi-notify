name: 緣結 會員贈禮排行（推 OBS 跑馬燈）
on:
  schedule:
    - cron: "20 16 * * *"    # 每天 UTC16:20 抓取完結直播聊天室，更新榜並推進跑馬燈
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  gift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 裝 chat-downloader
        run: pip install chat-downloader
      - name: 抓贈禮 + 推榜到跑馬燈
        env:
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          WORKER_DONATE_URL: ${{ secrets.WORKER_DONATE_URL }}
          DONATE_SECRET: ${{ secrets.DONATE_SECRET }}
        run: python gift_leaderboard.py
      - name: 存回狀態
        run: |
          git config user.name "enishi-bot"
          git config user.email "bot@enishi.dev"
          git add gift_state.json || true
          git commit -m "update gift_state" || echo "no change"
          git push || echo "nothing to push"
