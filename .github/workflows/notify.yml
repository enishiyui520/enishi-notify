name: 緣結 YouTube 通知
on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分鐘檢查（GitHub 排程可能延遲幾分鐘）
  workflow_dispatch: {}      # 也可手動觸發測試
permissions:
  contents: write
concurrency:
  group: notify
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 檢查並通知
        env:
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          WEBHOOK_LIVE: ${{ secrets.WEBHOOK_LIVE }}
          WEBHOOK_UPLOAD: ${{ secrets.WEBHOOK_UPLOAD }}
          PING_LIVE: ${{ secrets.PING_LIVE }}
        run: python notify.py
      - name: 保存狀態
        run: |
          git config user.name "enishi-notify"
          git config user.email "noreply@users.noreply.github.com"
          git add state.json
          git commit -m "update state" || echo "no change"
          git push || echo "push skipped"
