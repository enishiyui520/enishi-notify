name: 緣結 通知 
on:
  # 只由 enishi-cron worker 每 15 分 dispatch 一次（單一觸發源、避免雙發）。
  # ⚠️ 不要加回 schedule：GitHub 自排程 + worker dispatch 會同時開跑 → SNS/懶人包重複貼兩則。
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: notify
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝相依
        run: pip install -q twscrape chat-downloader youtube-transcript-api
      - name: YouTube 通知
        env:
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          WEBHOOK_LIVE: ${{ secrets.WEBHOOK_LIVE }}
          WEBHOOK_UPLOAD: ${{ secrets.WEBHOOK_UPLOAD }}
          PING_LIVE: ${{ secrets.PING_LIVE }}
        run: python notify.py
      - name: X 推特 通知
        env:
          WEBHOOK_SNS: ${{ secrets.WEBHOOK_SNS }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_TARGET: ${{ secrets.X_TARGET }}
        run: python x_notify.py
      - name: 直播精華＋懶人包
        env:
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          WEBHOOK_HL: ${{ secrets.WEBHOOK_HL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python highlights.py
      - name: 保存狀態
        run: |
          git config user.name "enishi-notify"
          git config user.email "noreply@users.noreply.github.com"
          git add state.json x_state.json highlights_state.json
          git commit -m "update state" || echo "no change"
          git push || echo "push skipped"
